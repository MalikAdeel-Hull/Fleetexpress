{% extends "base.html" %}
{% block title %}Error {{ code }} — Fleetexpress{% endblock %}

{% block content %}
<div class="auth-wrap" style="text-align:center">
  <div class="card auth-card">
    <div style="font-family:var(--font-serif);font-size:3.5rem;font-weight:600;color:var(--navy);line-height:1">{{ code }}</div>
    <p class="lead" style="margin-top:.5rem">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-navy">Back to start</a>
  </div>
</div>
{% endblock %}
